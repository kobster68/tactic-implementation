# Example overrides for the machine running the primary critical-service replica.
# Replace backup-host and receiver-host with names or IP addresses reachable over UDP.
redundancy.mode=passive
replica.role=primary
service.listen.port=5001
service.backup.host=backup-host
service.backup.port=5011
service.heartbeat.target.host=receiver-host
service.heartbeat.target.port=5002

