# Example overrides for the second machine. It runs the backup replica, receiver, and monitor.
# The backup shares one inbound UDP port for checkpoints, Promote, and active-mode readings.
redundancy.mode=passive
replica.role=backup
service.listen.port=5011
service.backup.host=localhost
service.backup.port=5011
service.heartbeat.target.host=localhost
service.heartbeat.target.port=5002
receiver.listen.port=5002
receiver.report.target.host=localhost
receiver.report.target.port=5003
monitor.listen.port=5003

