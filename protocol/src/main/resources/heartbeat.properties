# heartbeat.properties -- shared network + timing configuration for all four processes.
#
# One file, loaded by NetConfig, overridable with --config <path> or -Dkey=value.
# Defaults below are the human-watchable demo profile (beta). The textbook
# aggressive single-data-center profile ships commented out at the bottom.
#
# On one device the localhost defaults just work. On separate devices, override the *.host keys
# per host with -D flags; each process logs its effective endpoints at startup.

# ---- endpoints (localhost, distinct ports; each target.port equals its partner's listen.port) ----
# hop 1: sensor-sim -> critical-service
sensor.target.host=localhost
sensor.target.port=5001
service.listen.port=5001

# hop 2: critical-service -> receiver
service.heartbeat.target.host=localhost
service.heartbeat.target.port=5002
receiver.listen.port=5002

# hop 3: receiver -> monitor
receiver.report.target.host=localhost
receiver.report.target.port=5003
monitor.listen.port=5003

# ---- timings and probabilities (demo profile; fault knobs) ----
# There is no expireMs key. FAILED is declared after missedCount consecutive periods of
# silence (missed = floor((now - lastSeen) / period)); the derived expiry is missedCount x period:
# receiver hop 3 x heartbeat.periodMs = 3000 ms, monitor hop 3 x receiver.checkIntervalMs = 1500 ms.
heartbeat.periodMs=1000
receiver.checkIntervalMs=500
receiver.missedCount=3
monitor.checkIntervalMs=500
monitor.missedCount=3
sensor.periodMs=1000
sensor.faultProbability=0.1
sensor.corruptShare=0.5

# ---- aggressive single-data-center profile (SAiP4 p.252) ----
# Uncomment to detect within ~1 s; log only transitions and a per-second summary at this cadence.
#heartbeat.periodMs=200
#receiver.checkIntervalMs=200
#receiver.missedCount=3
#monitor.checkIntervalMs=200
#monitor.missedCount=3
#sensor.periodMs=200
